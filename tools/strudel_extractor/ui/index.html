<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strudel Extractor</title>
<!-- Import map MUST precede any module load: it routes @strudel/soundfonts' bare
     imports into the vendored engine (see vendor/soundfonts/strudel-shim.mjs). -->
<script type="importmap">
{
  "imports": {
    "@strudel/core": "/vendor/soundfonts/strudel-shim.mjs",
    "@strudel/webaudio": "/vendor/soundfonts/strudel-shim.mjs",
    "sfumato": "/vendor/soundfonts/sfumato.mjs",
    "soundfont2": "/vendor/soundfonts/soundfont2.mjs"
  }
}
</script>
<style>
  :root { color-scheme: dark; }
  body { background: #17151f; color: #e8e4da; font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 0; padding: 24px; }
  h1 { font-size: 18px; letter-spacing: 2px; margin: 0 0 4px; }
  .dirs { color: #8f8a7c; font-size: 12px; margin-bottom: 16px; }
  #rows { border-top: 1px solid #35313f; }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 2px; border-bottom: 1px solid #26232e; }
  .row.disabled { opacity: 0.4; }
  .row .name { flex: 0 0 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .adhoc { color: #b8a04a; font-size: 11px; }
  .row input[type="number"] { width: 58px; background: #211e2a; color: inherit; border: 1px solid #3c3849; border-radius: 4px; padding: 2px 4px; font: inherit; }
  .row label { display: flex; align-items: center; gap: 3px; }
  .row .status { margin-left: auto; color: #8f8a7c; min-width: 220px; text-align: right; }
  .row .status.ok { color: #7fc46a; }
  .row .status.fail { color: #e06a5a; }
  .row .status.busy { color: #d9b04a; }
  .bar { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  button { background: #2c2838; color: #e8e4da; border: 1px solid #4a4560; border-radius: 6px; padding: 8px 16px; font: inherit; cursor: pointer; }
  button:hover { background: #363048; }
  button:disabled { opacity: 0.45; cursor: default; }
  #process { background: #3d5a3a; border-color: #5a7f56; }
  #process:hover { background: #48693f; }
  #overall { color: #8f8a7c; }
  #banner { background: #3a2f22; border: 1px solid #6b5638; border-radius: 6px; padding: 8px 12px; margin: 12px 0; display: none; }
  .drop { outline: 2px dashed #6b5638; outline-offset: -8px; }
</style>
</head>
<body>
<h1>STRUDEL EXTRACTOR</h1>
<div class="dirs">in: <span id="inDir">…</span> &nbsp; out: <span id="outDir">…</span></div>
<div id="banner"></div>
<div id="rows"></div>
<div class="bar">
  <button id="addFile">+ add file</button>
  <input type="file" id="filePicker" accept=".strudel" multiple hidden>
  <button id="process">Process files</button>
  <button id="monitor">🔊 monitor: on</button>
  <span id="overall"></span>
</div>
<!-- Classic scripts: set window.strudel / window.WasmMediaEncoder before any module body runs. -->
<script src="/vendor/strudel-web.js"></script>
<script src="/vendor/ogg-encoder/WasmMediaEncoder.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
